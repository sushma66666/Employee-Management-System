<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagpur IT - Employee Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 500px; margin-bottom: 20px; }
        h2 { color: #2c3e50; text-align: center; }
        input { width: 93%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background-color: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #27ae60; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #34495e; color: white; }
        .delete-btn { background-color: #e74c3c; color: white; padding: 5px 10px; border: none; border-radius: 3px; cursor: pointer; }
        .delete-btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Nagpur IT - Employee Dashboard</h2>
        <!-- Form to Add Employee -->
        <input type="text" id="name" placeholder="Enter Full Name" required>
        <input type="email" id="email" placeholder="Enter Email Address" required>
        <input type="text" id="designation" placeholder="Enter Designation" required>
        <button onclick="addEmployee()">Add Employee</button>
    </div>

    <div class="container" style="width: 700px;">
        <h2>All Employees List</h2>
        <input type="text" id="searchName" placeholder="🔍 Search employee by name..." onkeyup="filterEmployees()">
        <!-- Table to Display Employees -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Designation</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="employeeTableBody">
                <!-- Data will come here dynamically via JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = "http://localhost:8080/api/employees";

        // 1. Database se saare employees lekar screen par dikhane ka function
        async function loadEmployees() {
            try {
                const response = await fetch(API_URL);
                const employees = await response.json();
                const tableBody = document.getElementById("employeeTableBody");
                tableBody.innerHTML = ""; // Purana data clear karein

                employees.forEach(emp => {
                    tableBody.innerHTML += `
                        <tr>
                            <td>${emp.id}</td>
                            <td>${emp.name}</td>
                            <td>${emp.email}</td>
                            <td>${emp.designation}</td>
                            <td><button class="delete-btn" onclick="deleteEmployee(${emp.id})">Delete</button></td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        // 2. Web page se data lekar database me save karne ka function
        async function addEmployee() {
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const designation = document.getElementById("designation").value;

            if(!name || !email || !designation) {
                alert("Please fill all fields!");
                return;
            }

            const employeeData = { name, email, designation };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(employeeData)
                });

                if(response.ok) {
                    alert("Employee Added successfully to Real Database!");
                    // Inputs clear karein
                    document.getElementById("name").value = "";
                    document.getElementById("email").value = "";
                    document.getElementById("designation").value = "";
                    loadEmployees(); // List refresh karein
                }
            } catch (error) {
                alert("Failed to add employee");
            }
        }

        // 3. ID ke zariye employee delete karne ka function
        async function deleteEmployee(id) {
            if(confirm("Are you sure you want to delete this employee?")) {
                try {
                    const response = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
                    if(response.ok) {
                        loadEmployees(); // List refresh karein
                    }
                } catch (error) {
                    alert("Failed to delete employee");
                }
            }
        }

        // Page load hote hi data automatic dikhe
        window.onload = loadEmployees;
    // 4. Live Search Filter Function
function filterEmployees() {
    let input = document.getElementById('searchName').value.toUpperCase();
    let table = document.getElementById('employeeTableBody');
    let tr = table.getElementsByTagName('tr');

    for (let i = 0; i < tr.length; i++) {
        let td = tr[i].getElementsByTagName('td')[1]; // [1] matlab Name ka column
        if (td) {
            let txtValue = td.textContent || td.innerText;
            if (txtValue.toUpperCase().indexOf(input) > -1) {
                tr[i].style.display = "";
            } else {
                tr[i].style.display = "none";
            }
        }
    }
}
</script>
</body>
</html>
